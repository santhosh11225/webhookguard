AWSTemplateFormatVersion: '2010-09-09'
Description: 'WebhookGuard Serverless Platform - Automated Webhook API Testing & Reliability'

Parameters:
  CodeBucket:
    Type: String
    Default: 'webhookguard-deploy-214654654450-ap-south-1'
    Description: 'S3 bucket containing the packaged Lambda zip'
  CodeKey:
    Type: String
    Default: 'lambda.zip'
    Description: 'S3 key for the packaged Lambda zip'
  AdminApiKey:
    Type: String
    NoEcho: true
    Default: 'guard_sec_214654_whguard_prod'
    Description: 'Admin API Key for WebhookGuard management endpoints'

Resources:
  # ==========================================
  # 1. DynamoDB Tables
  # ==========================================
  EndpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WebhookGuard-Endpoints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TestSuitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WebhookGuard-TestSuites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: endpointId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EndpointIndex
          KeySchema:
            - AttributeName: endpointId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TestRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WebhookGuard-TestRuns
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: endpointId
          AttributeType: S
        - AttributeName: startedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EndpointIndex
          KeySchema:
            - AttributeName: endpointId
              KeyType: HASH
            - AttributeName: startedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TestResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WebhookGuard-TestResults
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RunIndex
          KeySchema:
            - AttributeName: runId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================
  # 2. IAM Role for Lambda
  # ==========================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WebhookGuard-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebhookGuardDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt EndpointsTable.Arn
                  - !GetAtt TestSuitesTable.Arn
                  - !GetAtt TestRunsTable.Arn
                  - !GetAtt TestResultsTable.Arn
                  - !Sub '${EndpointsTable.Arn}/index/*'
                  - !Sub '${TestSuitesTable.Arn}/index/*'
                  - !Sub '${TestRunsTable.Arn}/index/*'
                  - !Sub '${TestResultsTable.Arn}/index/*'

  # ==========================================
  # 3. AWS Lambda Function
  # ==========================================
  BackendLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: WebhookGuard-Backend
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          NODE_ENV: production
          DB_PROVIDER: dynamodb
          ENDPOINTS_TABLE: !Ref EndpointsTable
          SUITES_TABLE: !Ref TestSuitesTable
          RUNS_TABLE: !Ref TestRunsTable
          RESULTS_TABLE: !Ref TestResultsTable
          API_GATEWAY_URL: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
          ADMIN_API_KEY: !Ref AdminApiKey
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

  # ==========================================
  # 4. Amazon API Gateway (HTTP API v2)
  # ==========================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: WebhookGuard-Api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          - HEAD
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Signature
          - X-API-Key
          - X-Signature-Header
          - X-Requested-With
        MaxAge: 86400

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendLambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Join ['', ['integrations/', !Ref HttpApiIntegration]]

  HttpApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt BackendLambdaFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ==========================================
  # 5. Frontend Private S3 + CloudFront (OAC)
  # ==========================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'webhookguard-frontend-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: WebhookGuard-Frontend-OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  ApiUrl:
    Description: 'HTTP API Gateway Production Endpoint'
    Value: !GetAtt HttpApi.ApiEndpoint
  FrontendUrl:
    Description: 'CloudFront HTTPS Production Distribution URL'
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: 'Frontend S3 Bucket Name'
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref FrontendDistribution
  LambdaArn:
    Description: 'Backend Lambda Function ARN'
    Value: !GetAtt BackendLambdaFunction.Arn
  EndpointsTableName:
    Description: 'DynamoDB Endpoints Table'
    Value: !Ref EndpointsTable
  TestSuitesTableName:
    Description: 'DynamoDB TestSuites Table'
    Value: !Ref TestSuitesTable
  TestRunsTableName:
    Description: 'DynamoDB TestRuns Table'
    Value: !Ref TestRunsTable
  TestResultsTableName:
    Description: 'DynamoDB TestResults Table'
    Value: !Ref TestResultsTable
